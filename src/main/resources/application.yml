spring:
  application:
    name: lending-backend
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

lending:
  reservation:
    expiry: 10m
    cleanup-delay: 30s

